[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "boatev"
version = "0.1.0"
description = "ボートレース単勝の期待値予測システム"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
boatev = "boatev.cli:main"

[tool.setuptools]
packages = ["boatev"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
